<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">laguna-wire — an MCP server that delegates coding tasks to Laguna S 2.1</title>
  <desc id="heroDesc">Dark technical title card. Left: the name laguna-wire above a plain-language description — delegate a coding task to Laguna S 2.1 from inside Claude Code, where it edits files unattended while seven runtime guards bound what it can reach. Right: the real backend command, pool exec -o json --unsafe-auto-allow -d cwd -p task, with the auto-approve flag marked in amber; below it a dashed teal boundary labelled INV3 ALLOW_ROOT holding the working directory.</desc>

  <rect width="1200" height="372" rx="24" fill="#07090B"/>
  <rect x="0.75" y="0.75" width="1198.5" height="370.5" rx="23.25" fill="none" stroke="#182023" stroke-width="1.5"/>

  <!-- identity -->
  <g transform="translate(56 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.4" fill="#6E7D81">MCP SERVER · CLAUDE CODE → LAGUNA S 2.1</text>
    <text y="164" font-size="74" font-weight="700" letter-spacing="-1.5" fill="#E8EDEE">laguna-<tspan fill="#4FD1C5">wire</tspan></text>
    <text y="212" font-size="25" fill="#B9C5C8">Delegate a coding task to Laguna S 2.1 from</text>
    <text y="244" font-size="25" fill="#B9C5C8">inside Claude Code. It edits files unattended;</text>
    <text y="276" font-size="25" fill="#B9C5C8">seven runtime guards bound what it can reach.</text>
    <text y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#556468">node ≥20 · 1 dependency · 4 tools · stdio · no API key</text>
  </g>

  <!-- real backend invocation -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="700" y="52" width="444" height="172" rx="12" fill="#0E1315" stroke="#1F2A2D" stroke-width="1.5"/>
    <text x="724" y="84" font-size="18" fill="#556468">backend — one shot per call</text>
    <text x="724" y="124" font-size="20" fill="#B9C5C8">pool exec -o json \</text>
    <text x="748" y="154" font-size="20" fill="#E8A33D">--unsafe-auto-allow \</text>
    <text x="748" y="184" font-size="20" fill="#B9C5C8">-d &lt;cwd&gt; -p "&lt;task&gt;"</text>

    <!-- containment boundary: the motif -->
    <text x="700" y="254" font-size="18" letter-spacing="1.6" fill="#4FD1C5">INV3 · ALLOW_ROOT</text>
    <rect x="700" y="262" width="444" height="62" rx="10" fill="#0B1113" stroke="#4FD1C5" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="724" y="300" font-size="20" fill="#DCE5E7">cwd = ~/code/your-repo</text>
    <path d="M1098 294 l7 8 l14 -18" fill="none" stroke="#4FD1C5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
